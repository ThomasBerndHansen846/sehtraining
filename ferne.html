<style>
@font-face { font-family: "Atkinson Hyperlegible"; font-weight: 400; font-style: normal; font-display: swap;
  src: url("schrift/AtkinsonHyperlegible-Regular.ttf") format("truetype"); }
@font-face { font-family: "Atkinson Hyperlegible"; font-weight: 700; font-style: normal; font-display: swap;
  src: url("schrift/AtkinsonHyperlegible-Bold.ttf") format("truetype"); }

<style>
/* Fernsehtest am MacBook: dunkle Übersicht wie in der Web-App, große Schrift (die zweite Person
   liest am MacBook, oft ohne Lesebrille). Während der Messung füllt der Buchstabentest das Fenster
   (am besten im Vollbild); die Buchstaben stehen schwarz auf weißem Feld. Die Farben sind dieselben
   wie in vorlage.html. */
:root {
  --nacht: #101417; --flaeche: #1b2227; --linie: #2f3a41; --text: #eef2f3; --leise: #a3b0b6;
  --akzent: #9fd3c4; --akzent-text: #0c1a17; --warnung: #f2c46d;
  --knopf-hg: #26313a; --knopf-text: #eef2f3; --hg: #101417;
  --schrift: "Atkinson Hyperlegible", "Helvetica Neue", Arial, sans-serif;
  color-scheme: dark;
}
html { font-size: 24px; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--nacht); color: var(--text); font-family: var(--schrift); font-size: 1rem; line-height: 1.45;
  -webkit-text-size-adjust: 100%; }
h1 { font-size: 1.4rem; line-height: 1.1; margin: 0; }
p { margin: 0; }
button { font: inherit; }
#ferne { display: flex; flex-direction: column; gap: 18px; max-width: 980px; margin: 0 auto; padding: 24px 24px 40px; }
.kopf { display: flex; flex-direction: column; gap: 4px; }
.kopf .unter { color: var(--leise); font-size: 0.85rem; }
.karte { background: var(--flaeche); border: 1px solid var(--linie); border-radius: 18px; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.eyebrow { font-size: 0.7rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--leise); }
.stand { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; margin: 0; font-size: 0.9rem; }
.stand dt { color: var(--leise); }
.stand dd { margin: 0; }
.reihe { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px; }
.gross { display: block; width: 100%; min-height: 56px; border-radius: 14px; border: 1px solid var(--linie);
  background: var(--knopf-hg); color: var(--knopf-text); font-size: 0.95rem; font-weight: 700; padding: 10px 16px; cursor: pointer; }
.gross.haupt { background: var(--akzent); color: var(--akzent-text); border-color: var(--akzent); }
a.gross { box-sizing: border-box; text-align: center; text-decoration: none; line-height: 34px; }
.gross:disabled { opacity: 0.4; cursor: default; }
.gross.gewaehlt { outline: 3px solid var(--akzent); }
.gross:focus-visible { outline: 3px solid var(--warnung); outline-offset: 2px; }
.hinweis { border-left: 4px solid var(--warnung); padding: 6px 0 6px 12px; }
.leise { color: var(--leise); font-size: 0.8rem; }
.feld-titel { color: var(--leise); margin-bottom: -8px; }
.eingabe { display: block; width: 100%; box-sizing: border-box; min-height: 56px; padding: 10px 12px; border-radius: 12px;
  border: 1px solid var(--linie); background: var(--nacht); color: var(--text); font: inherit; font-size: 1rem; }
.eingabe-klein { max-width: 8em; }
.eingabe:focus { outline: 3px solid var(--akzent); outline-offset: 1px; }
.schritte { margin: 0; padding-left: 1.4em; display: flex; flex-direction: column; gap: 8px; }
table.tabelle { border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 0.9rem; }
.tabelle th, .tabelle td { padding: 6px 14px 6px 0; border-bottom: 1px solid var(--linie); text-align: left; white-space: nowrap; }
.tabelle th { color: var(--leise); font-weight: 400; }
/* Module (Größenabgleich, Buchstabentest) füllen das Fenster */
#ferne-modul { position: fixed; inset: 0; background: var(--hg); z-index: 5; }
.modul-flaeche { position: absolute; inset: 0; }
</style>
<main id="ferne"></main>
<section id="ferne-modul" hidden></section>
<script>

window.SEHTRAINING_FASSUNG = "2026-11-01-23edf9";

<script>
// ===== kalibrierung.js =====
/*
 * kalibrierung.js – Einrichtung des Bildschirms für das Sehtraining
 *
 * Vier Teile, jeder startet mit einer eigenen Funktion an window.Kalibrierung:
 *
 *   groesse(container, vorgabeMmProPunkt, fertig, texte)
 *       Erst eine Anleitung, dann wird eine Karte im Scheckkartenformat (Normgröße
 *       85,60 × 53,98 mm) auf den Bildschirm gelegt; der Nutzer stellt ein Rechteck auf
 *       die Länge der Karte ein. Ergebnis: Millimeter je CSS-Pixel (kurz „Punkt“), oder
 *       null bei „Überspringen“. texte (wahlweise, für den Fernsehtest am Rechner):
 *       { titel, zweck, schritte: [drei Sätze], vorgabe } ersetzt die Texte der Anleitung.
 *
 *   kennlinie(container, fertig)
 *       Findet den Grauwert, der halb so hell leuchtet wie Weiß. Links ein Feld aus
 *       abwechselnd einem Geräte-Bildpunkt Weiß und einem Schwarz (im Mittel genau
 *       halbe Helligkeit), rechts eine graue Fläche. Daraus folgt die Kennlinie
 *       Helligkeit = (Grauwert / 255) ^ gamma. Ergebnis: { gamma, grauHalb } oder null.
 *
 *   bildtakt(dauerMs, fertig)
 *       Misst ohne Oberfläche, wie oft der Browser pro Sekunde ein neues Bild
 *       zeichnen darf (requestAnimationFrame). Ergebnis:
 *       { hz, anteilAusgelassen, anzahl, medianMs }.
 *
 *   pruefliste(container, fertig)
 *       Liste der iPhone-Einstellungen zum Abhaken. fertig(true), wenn alles
 *       abgehakt ist, fertig(false) bei „Überspringen“.
 *
 * Reine Funktionen (ohne DOM, mit jsc testbar): gammaAusGrau, mmProPunktAusBreite
 * sowie die Hilfsfunktionen mit Unterstrich (_auswertungBildtakt usw.).
 *
 * Das Modul lässt sich ohne DOM laden; das DOM wird erst in den Startfunktionen
 * benutzt. Eigene Stile werden einmalig eingefügt, alle Klassen beginnen mit „kal-“.
 * Zeichen außerhalb von ASCII stehen in Zeichenketten als \u-Schreibweise, damit die
 * Datei auch bei falsch eingestellter Zeichenkodierung der Seite richtig ankommt.
 */
(function (global) {
  'use strict';

  // ======================================================================
  // Festwerte
  // ======================================================================

  // Bankkarte nach ISO/IEC 7810 ID-1: Seiten und Eckenradius in Millimetern.
  var KARTE_LANG_MM = 85.60;
  var KARTE_KURZ_MM = 53.98;
  var KARTE_ECKE_MM = 3.18;

  // Millimeter je CSS-Pixel beim iPhone 12 Pro (390 Punkte = 64,6 mm).
  var VORGABE_MM_PRO_PUNKT = 0.1657;

  // Rand um das Rechteck im Größenabgleich (CSS-Pixel) und Grenzen der Länge.
  var KARTE_RAND_PUNKTE = 16;
  var KARTE_BREITE_MIN = 80;
  var KARTE_BREITE_MAX = 3000;

  // Helligkeitskennlinie.
  var GRAU_START = 186;             // Startwert der ersten Einstellung
  var GRAU_ZUFALL_MIN = 160;        // Bereich für den Zufallsstart der Wiederholung
  var GRAU_ZUFALL_MAX = 215;
  var GRAU_MIN = 20;                // Grenzen der Einstellung (255 wäre nicht auswertbar)
  var GRAU_MAX = 250;
  var GAMMA_MIN = 1.6;              // Bereich, den wir als plausibel ansehen
  var GAMMA_MAX = 3.0;
  var STREUUNG_WARNUNG = 12;        // so weit dürfen die beiden Einstellungen auseinanderliegen
  var FELD_RAND_PUNKTE = 8;         // schwarzer Rand um die beiden Felder (CSS-Pixel)
  var FELD_HOEHE_MIN_PUNKTE = 245;  // 4 cm bei 0,1657 mm je Punkt sind 241 Punkte
  var FELD_HOEHE_MAX_PUNKTE = 420;

  // Bildtakt.
  var BILDTAKT_VORGABE_MS = 2000;
  var BILDTAKT_VERWERFEN = 10;      // die ersten Abstände gelten als Anlaufen
  var BILDTAKT_AUSLASS_FAKTOR = 1.5;

  // Die Punkte der Prüfliste: Titel und Weg durch die iPhone-Einstellungen.
  var PRUEFPUNKTE = [
    { titel: 'Automatische Helligkeit aus',
      detail: 'Einstellungen \u2192 Bedienungshilfen \u2192 Anzeige & Textgr\u00f6\u00dfe \u2192 ganz unten' },
    { titel: 'True Tone aus und Night Shift aus',
      detail: 'Einstellungen \u2192 Anzeige & Helligkeit' },
    { titel: 'Stromsparmodus aus',
      detail: 'Einstellungen \u2192 Batterie' },
    { titel: 'Helligkeit ganz hoch',
      detail: 'Kontrollzentrum' },
    { titel: 'Raum abgedunkelt, nur das iPhone leuchtet',
      detail: '' },
    { titel: 'Ausrichtungssperre im Hochformat an',
      detail: 'Kontrollzentrum' },
    { titel: 'Beim Training: keine Lesebrille, Abstand 40 cm',
      detail: 'z. B. mit einer 40 cm langen Schnur zwischen Kinn und iPhone pr\u00fcfen; f\u00fcr die Einrichtung ist jede Brille erlaubt' }
  ];

  // ======================================================================
  // Reine Funktionen (kein DOM)
  // ======================================================================

  // Exponent der Kennlinie Helligkeit = (Grauwert / 255) ^ gamma, wenn der Grauwert
  // „grauHalb“ halb so hell leuchtet wie Weiß (255): 0,5 = (grauHalb / 255) ^ gamma.
  // Außerhalb von 0 < grauHalb < 255 gibt es keine Lösung (NaN).
  function gammaAusGrau(grauHalb) {
    if (!(grauHalb > 0 && grauHalb < 255)) return NaN;
    return Math.log(0.5) / Math.log(grauHalb / 255);
  }

  // Millimeter je CSS-Pixel aus der Länge der langen Kante der auf die Karte
  // eingestellten Fläche in CSS-Pixeln (bei quer liegendem Rechteck ist das die Breite).
  function mmProPunktAusBreite(breitePunkte) {
    return KARTE_LANG_MM / breitePunkte;
  }

  // Maße des Kartenrechtecks in CSS-Pixeln. „breite“ ist immer die lange Kante der
  // Karte; hochkant steht sie senkrecht (dann ist die Breite des Rechtecks die kurze Kante).
  function _kartenmasse(breite, hochkant) {
    var kurz = breite * KARTE_KURZ_MM / KARTE_LANG_MM;
    return hochkant ? { w: kurz, h: breite } : { w: breite, h: kurz };
  }

  // Muss das Rechteck hochkant gezeigt werden? Ja, wenn es quer nicht in den
  // verfügbaren Platz (CSS-Pixel) passt.
  function _hochkantNoetig(breite, platzB, platzH) {
    var m = _kartenmasse(breite, false);
    return !(m.w <= platzB && m.h <= platzH);
  }

  // Median einer Zahlenliste (Kopie wird sortiert; leere Liste: NaN).
  function _median(werte) {
    var n = werte.length;
    if (n === 0) return NaN;
    var s = werte.slice().sort(function (a, b) { return a - b; });
    var mitte = Math.floor(n / 2);
    return (n % 2 === 1) ? s[mitte] : (s[mitte - 1] + s[mitte]) / 2;
  }

  // Aus den Zeitstempeln aufeinanderfolgender Bilder die Abstände bilden und die
  // ersten „verwerfen“ Abstände weglassen (Anlaufen).
  function _abstaendeAusZeiten(zeitenMs, verwerfen) {
    var abstaende = [];
    for (var i = 1; i < zeitenMs.length; i++) {
      abstaende.push(zeitenMs[i] - zeitenMs[i - 1]);
    }
    return abstaende.slice(verwerfen || 0);
  }

  // Auswertung der Abstände zwischen Bildern (in Millisekunden, Anlaufen schon
  // entfernt): Median, daraus die Bildrate, und der Anteil der Abstände, die länger
  // als 1,5-mal der Median dauerten (= ein Bild wurde ausgelassen).
  function _auswertungBildtakt(abstaendeMs) {
    var n = abstaendeMs.length;
    if (n === 0) {
      return { hz: null, anteilAusgelassen: null, anzahl: 0, medianMs: null };
    }
    var median = _median(abstaendeMs);
    var lang = 0;
    for (var i = 0; i < n; i++) {
      if (abstaendeMs[i] > BILDTAKT_AUSLASS_FAKTOR * median) lang++;
    }
    var hz = (median > 0) ? Math.round(1000 / median * 10) / 10 : null;
    return { hz: hz, anteilAusgelassen: lang / n, anzahl: n, medianMs: median };
  }

  // Zufälliger Startgrauwert für die Wiederholung (ganze Zahl von 160 bis 215).
  // „zufall“ liefert Zahlen von 0 (einschließlich) bis 1 (ausschließlich), z. B. Math.random.
  function _zufallsStart(zufall) {
    var spanne = GRAU_ZUFALL_MAX - GRAU_ZUFALL_MIN + 1;
    var g = GRAU_ZUFALL_MIN + Math.floor(zufall() * spanne);
    return Math.min(GRAU_ZUFALL_MAX, Math.max(GRAU_ZUFALL_MIN, g));
  }

  // Ergebnis aus den eingestellten Grauwerten: Mittelwert, Kennlinie, Plausibilität
  // und Streuung (Abstand zwischen der kleinsten und der größten Einstellung).
  function _ergebnisKennlinie(werte) {
    var summe = 0;
    for (var i = 0; i < werte.length; i++) summe += werte[i];
    var grauHalb = summe / werte.length;
    var gamma = gammaAusGrau(grauHalb);
    var streuung = Math.max.apply(null, werte) - Math.min.apply(null, werte);
    // Die Grenzen zählen mit; die kleine Toleranz fängt Rundungsfehler der
    // Gleitkommazahlen genau auf der Grenze ab.
    var plausibel = isFinite(gamma) && gamma >= GAMMA_MIN - 1e-9 && gamma <= GAMMA_MAX + 1e-9;
    return { grauHalb: grauHalb, gamma: gamma, plausibel: plausibel, streuung: streuung };
  }

  // Verschiebung (CSS-Pixel), die eine Position auf einen ganzen Geräte-Bildpunkt
  // legt; 0, wenn sie schon (fast) darauf liegt.
  function _korrekturZumGeraetepunkt(positionCss, dpr) {
    var geraet = positionCss * dpr;
    var diff = Math.round(geraet) - geraet;
    return (Math.abs(diff) < 0.02) ? 0 : diff / dpr;
  }

  // Zahl mit deutschem Komma.
  function _zahlDe(x, nachkommastellen) {
    return x.toFixed(nachkommastellen).replace('.', ',');
  }

  // ======================================================================
  // Stile (einmalig eingefügt)
  // ======================================================================

  var STIL = [
    '.kal-wurzel{position:absolute;top:0;right:0;bottom:0;left:0;box-sizing:border-box;display:flex;flex-direction:column;',
    'background:var(--hg,#000);color:var(--text,#eee);',
    'font-family:var(--schrift,-apple-system,BlinkMacSystemFont,"Helvetica Neue",Helvetica,Arial,sans-serif);font-size:1rem;line-height:1.4;',
    'overflow:hidden;overscroll-behavior:none;text-align:left;',
    '-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}',
    '.kal-wurzel *{box-sizing:border-box}',
    '.kal-schwarz{background:#000}',
    '.kal-kopf{flex:0 0 auto;padding:calc(8px + env(safe-area-inset-top,0px)) 16px 4px}',
    '.kal-titel{margin:0 0 8px;font-size:1.2rem;font-weight:700;line-height:1.2}',
    '.kal-text{margin:0 0 6px;font-size:1rem;line-height:1.35}',
    '.kal-leise{opacity:.8;font-size:.85rem}',
    '.kal-warnung{color:#ffb454;font-weight:600}',
    '.kal-buehne{flex:1 1 auto;min-height:0;position:relative;display:flex;align-items:center;justify-content:center}',
    '.kal-fueller{flex:1 1 auto}',
    // Lesetext (Anleitung, Ergebnis): darf länger sein als der Bildschirm und wird dann geschoben
    '.kal-lesen{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;',
    'padding:calc(12px + env(safe-area-inset-top,0px)) 16px 8px}',
    '.kal-lesen .kal-text{margin:0 0 14px}',
    '.kal-schritte{margin:0 0 14px;padding-left:1.4em}',
    '.kal-schritte li{margin:0 0 10px}',
    '.kal-leiste{flex:0 0 auto;display:flex;flex-wrap:wrap;justify-content:center;gap:6px;',
    'padding:6px 8px calc(8px + env(safe-area-inset-bottom,0px))}',
    '.kal-umbruch{flex:0 0 100%;height:0}',
    '.kal-knopf{min-width:52px;min-height:52px;padding:0 12px;border:0;border-radius:12px;',
    'background:var(--knopf-hg,#333);color:var(--knopf-text,#fff);font-family:inherit;font-size:1rem;line-height:1.1;',
    'text-align:center;touch-action:manipulation;cursor:pointer;-webkit-appearance:none;appearance:none}',
    '.kal-knopf:active{filter:brightness(1.35)}',
    '.kal-knopf[disabled]{opacity:.35;cursor:default}',
    '.kal-knopf-haupt{box-shadow:inset 0 0 0 2px var(--text,#eee);font-weight:700}',
    '.kal-knopf-gross{min-height:60px}',
    // Ansichten mit Messfläche (Rechteck, Helligkeitsfelder): feste Schriftgröße, unabhängig von der
    // gewählten Schrift der Seite, damit Fläche und Knöpfe immer ganz auf den Bildschirm passen
    '.kal-fest .kal-titel{font-size:26px}',
    '.kal-fest .kal-text{font-size:22px}',
    '.kal-fest .kal-knopf{font-size:22px}',
    // Größenabgleich: das Kartenrechteck (Größe wird im Skript gesetzt)
    '.kal-karte{flex:0 0 auto;position:relative;border:2px solid var(--text,#eee);',
    'display:flex;align-items:center;justify-content:center}',
    '.kal-karte-text{padding:8px;text-align:center;font-size:.75rem;line-height:1.5;opacity:.5}',
    // Helligkeitskennlinie: Canvas ohne Skalierung
    '.kal-canvas{display:block;flex:0 0 auto;touch-action:none;image-rendering:pixelated}',
    // Prüfliste
    '.kal-pl-liste{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 16px}',
    '.kal-pl-zeile{position:relative;display:flex;align-items:flex-start;gap:14px;min-height:56px;padding:12px 0;',
    'border-bottom:1px solid rgba(128,128,128,.35);cursor:pointer}',
    '.kal-pl-eingabe{position:absolute;opacity:0;width:1px;height:1px;margin:0;pointer-events:none}',
    '.kal-pl-kasten{flex:0 0 auto;width:40px;height:40px;border:2px solid var(--text,#eee);border-radius:8px;',
    'display:flex;align-items:center;justify-content:center;font-size:26px;line-height:1;color:transparent}',
    '.kal-pl-eingabe:checked + .kal-pl-kasten{background:var(--text,#eee);color:var(--hg,#000)}',
    '.kal-pl-text{flex:1 1 auto;min-width:0;padding-top:1px}',
    '.kal-pl-kopf{padding:calc(12px + env(safe-area-inset-top,0px)) 0 4px}',
    '.kal-pl-titel{font-size:1rem;font-weight:700}',
    '.kal-pl-detail{margin-top:4px;font-size:.85rem;opacity:.8}'
  ].join('');

  function stilEinfuegen() {
    var d = global.document;
    if (d.getElementById('kal-stil')) return;
    var s = d.createElement('style');
    s.id = 'kal-stil';
    s.textContent = STIL;
    (d.head || d.documentElement).appendChild(s);
  }

  // ======================================================================
  // Kleine Helfer für das DOM
  // ======================================================================

  function el(tag, klasse, text) {
    var e = global.document.createElement(tag);
    if (klasse) e.className = klasse;
    if (text !== undefined && text !== null) e.textContent = text;
    return e;
  }

  function knopf(text, beiKlick, zusatzKlasse) {
    var b = el('button', 'kal-knopf' + (zusatzKlasse ? ' ' + zusatzKlasse : ''), text);
    b.type = 'button';
    b.addEventListener('click', beiKlick);
    return b;
  }

  // Erzwingt in einer Knopfleiste einen Zeilenumbruch an dieser Stelle.
  function umbruch() {
    return el('div', 'kal-umbruch');
  }

  function leeren(knoten) {
    while (knoten.firstChild) knoten.removeChild(knoten.firstChild);
  }

  // Bereitet das übergebene DIV vor: Stile, leeren, Mindestgröße, und legt darin eine
  // eigene Fläche („Wurzel“) an, die das DIV ganz ausfüllt und die Bildschirmteile
  // senkrecht anordnet (Kopf, Bühne, Knopfleiste). Die Anordnung hängt so nicht davon ab,
  // wie die einbindende Seite das DIV selbst anzeigt (display, Größe per Stilregel).
  // Gibt die Wurzel zurück; alle Ansichten werden in sie hineingebaut.
  function vorbereiten(container) {
    stilEinfuegen();
    leeren(container);
    if (global.getComputedStyle(container).position === 'static') {
      container.style.position = 'relative';
    }
    // Hat das DIV (noch) keine Höhe, füllen wir wenigstens das Fenster.
    if (container.clientHeight < 50) {
      container.style.height = global.innerHeight + 'px';
    }
    var wurzel = el('div', 'kal-wurzel');
    container.appendChild(wurzel);
    return wurzel;
  }

  // ======================================================================
  // 1. Größenabgleich
  // ======================================================================

  function groesse(container, vorgabeMmProPunkt, fertig, texte) {
    var wurzel = vorbereiten(container);
    texte = texte || {};

    var vorgabe = (isFinite(vorgabeMmProPunkt) && vorgabeMmProPunkt > 0)
      ? vorgabeMmProPunkt : VORGABE_MM_PRO_PUNKT;
    var breite = KARTE_LANG_MM / vorgabe;   // lange Kante der Karte in CSS-Pixeln
    var hochkant = false;
    var abgeschlossen = false;
    var buehne = null, karte = null, karteZeile2 = null;   // erst in der Ansicht mit dem Rechteck

    function beenden(ergebnis) {
      if (abgeschlossen) return;
      abgeschlossen = true;
      global.removeEventListener('resize', beiGroesse);
      leeren(container);
      if (typeof fertig === 'function') fertig(ergebnis);
    }

    // --- Ansicht 1: Anleitung (Zweck und Vorgehen; hier ist Platz für großen Text) ---
    function zeigeAnleitung() {
      leeren(wurzel);
      wurzel.classList.remove('kal-fest');

  // ======================================================================
  // 3. Bildtakt
  // ======================================================================

  function bildtakt(dauerMs, fertig) {
    var dauer = (isFinite(dauerMs) && dauerMs > 0) ? dauerMs : BILDTAKT_VORGABE_MS;
    var zeiten = [];       // Zeitstempel der Bilder in Millisekunden
    var start = null;

  var ZEHNTEL_MAX = 10;

  // Fernsehtest: In der Ferne sehen gesunde Augen oft besser als Visus 1,0, deshalb Zeilen bis
  // -0,3 (Visus 2,0). Die gröbste Zeile richtet sich nach der Höhe des Bildschirms (höchstens 1,0).
  // Passen keine drei Buchstaben in die Breite, zeigt die Zeile weniger, mindestens einen.
  var FERNE_ZEHNTEL_MIN = -3;
  var FERNE_START = 0.5;
  var FERNE_MINDESTENS = 1;

  // Eine Zeile gilt als „gelesen“, wenn mindestens dieser Anteil richtig ist
  // (4 von 5 = 0,8). Bei kürzeren Zeilen wird der Anteil entsprechend angewendet.
  var BESTEHEN_ANTEIL = 0.8;

  // Farbe der Markierung unter dem Buchstaben, der gerade dran ist (auf dem weißen Feld).
  var MARKE_FARBE = '#e07b00';

  // Maße des weißen Feldes in CSS-Pixeln (ganze Zahlen, damit das Feld auf ganzen
  // Bildpunkten des Bildschirms liegt und nicht unscharf wird).
  var FELD_OBEN = 16;          // Abstand vom oberen Rand bis zur Oberkante der größten Zeile
  var MARKE_ABSTAND = 9;       // Abstand von der Buchstaben-Unterkante bis zur Spitze der Markierung
  var MARKE_HOEHE = 8;         // Höhe der dreieckigen Markierung
  var MARKE_BREITE = 12;       // Breite der dreieckigen Markierung
  var FELD_UNTEN = 10;         // Abstand unter der Markierung
  var SEITENRAND = 8;          // Mindestabstand der Zeile zum linken und rechten Rand

  var aktiv = null;            // der gerade laufende Test (höchstens einer)

  // ======================================================================
  // 2. Reine Funktionen (ohne DOM)
  // ======================================================================

  // Auf zwei Nachkommastellen runden und „-0“ vermeiden.
  function runde2(x) {
    var r = Math.round(x * 100) / 100;
    return r === 0 ? 0 : r;
  }

  // Buchstabenhöhe in mm. Ein Sloan-Buchstabe der Höhe h hat Strichstärke h/5; diese
  // Strichstärke soll unter 1 Bogenminute * 10^logMAR erscheinen. Die ganze Höhe also
  // unter 5 Bogenminuten * 10^logMAR, gerechnet auf den Sehabstand.
  function hoeheMm(logmar, abstandMm) {
    var bogenminuten = 5 * Math.pow(10, logmar);
    var bogenmass = (bogenminuten / 60) * Math.PI / 180;
    return abstandMm * Math.tan(bogenmass);
  }

  // Zufällige, voneinander verschiedene Buchstaben als Zeichenkette (Vorgabe: 5 Stück).
  // zufall: Funktion, die Zahlen in [0,1) liefert (Vorgabe Math.random). Wir ziehen
  // der Reihe nach aus einem Vorrat, aus dem jeder gezogene Buchstabe entfernt wird;
  // so kann kein Buchstabe doppelt vorkommen.
  function zufallszeile(zufall, anzahl) {
    var f = (typeof zufall === 'function') ? zufall : Math.random;
    var n = (anzahl == null) ? ZEILENLAENGE : Math.floor(anzahl);
    n = Math.max(1, Math.min(BUCHSTABEN.length, n));
    var vorrat = BUCHSTABEN.split('');
    var zeile = '';
    for (var i = 0; i < n; i++) {
      var k = Math.floor(f() * vorrat.length);
      if (!(k >= 0)) k = 0;                                  // auch bei NaN
      if (k >= vorrat.length) k = vorrat.length - 1;         // falls zufall() doch 1 liefert
      zeile += vorrat.splice(k, 1)[0];
    }
    return zeile;
  }

  // Wie viele Buchstaben einer Zeile gezeigt wurden. Fehlt die Angabe, gilt der Regelfall.
  function anzahlBuchstaben(z) {
    var b = z && z.buchstaben;
    if (b != null && typeof b.length === 'number' && b.length > 0) return b.length;
    return ZEILENLAENGE;
  }

  // Wie viele Buchstaben einer Zeile richtig waren: entweder das Feld „richtig“
  // oder, falls es fehlt, der Vergleich von Buchstaben und Antworten.
  function richtigeAnzahl(z) {
    if (typeof z.richtig === 'number') return z.richtig;
    var r = 0, b = z.buchstaben || '', a = z.antworten || '';
    for (var i = 0; i < b.length; i++) if (a[i] === b[i]) r++;
    return r;
  }

  // Wertung Buchstabe für Buchstabe (wie bei der ETDRS-Tafel):
  //   logMAR = L0 + 0,1 - 0,02 * (alle richtigen Buchstaben in Zeilen mit logMAR <= L0)
  // L0 ist die größte gezeigte Zeile. Bei Zeilen mit weniger als 5 Buchstaben zählt jeder
  // Buchstabe entsprechend mehr (0,1 / Anzahl statt 0,02), so dass jede Zeile insgesamt
  // 0,1 logMAR wert bleibt. Ergebnis höchstens 1,1.
  // Gerechnet wird in Hundertsteln (ganze Zahlen), damit nichts durch Rundung verrutscht.
  function wertung(zeilen) {
    var l0 = -Infinity;                    // L0 in Zehnteln
    var i, z, zehntel;
    for (i = 0; i < zeilen.length; i++) {
      zehntel = Math.round(zeilen[i].logmar * 10);
      if (zehntel > l0) l0 = zehntel;
    }
    if (l0 === -Infinity) return { logmar: 1.1, richtig: 0, gezeigt: 0 };

    var richtig = 0, gezeigt = 0, abzug = 0;           // abzug in Hundertsteln logMAR
    for (i = 0; i < zeilen.length; i++) {
      z = zeilen[i];
      var n = anzahlBuchstaben(z);
      var r = richtigeAnzahl(z);
      richtig += r;
      gezeigt += n;
      if (Math.round(z.logmar * 10) <= l0) abzug += r * 10 / n;
    }
    var hundertstel = Math.min(110, l0 * 10 + 10 - abzug);
    return { logmar: runde2(Math.round(hundertstel) / 100), richtig: richtig, gezeigt: gezeigt };
  }

  // Wie viele Buchstaben einer Zeile in die Breite passen. Eine Zeile aus n Buchstaben ist
  // (2n - 1) Buchstabenbreiten breit (Zwischenraum = eine Buchstabenbreite). Wir verkleinern
  // nie, sondern zeigen weniger Buchstaben, aber mindestens 3 (Fernsehtest: mindestens 1,
  // Angabe „mindestens“) und höchstens 5.
  function passendeAnzahl(hoeheCss, breiteCss, mindestens) {
    var minimum = (mindestens >= 1) ? Math.floor(mindestens) : 3;
    if (!(hoeheCss > 0) || !(breiteCss > 0)) return ZEILENLAENGE;
    var n = Math.floor((breiteCss / hoeheCss + 1) / 2 + 1e-9);
    return Math.max(minimum, Math.min(ZEILENLAENGE, n));
  }

  // Gröbste Zeile (in Zehnteln logMAR), deren Buchstaben noch ganz in die gegebene Höhe passen,
  // höchstens 1,0. Passt nicht einmal die Startzeile hinein, gilt die Startzeile (Notfall).
  function groessteZeile(hoeheVerfuegbarCss, abstandMm, mmProPunkt, untergrenze) {
    for (var z = ZEHNTEL_MAX; z > untergrenze; z--) {
      if (Math.ceil(hoeheMm(z / 10, abstandMm) / mmProPunkt) <= hoeheVerfuegbarCss) return z;
    }
    return untergrenze;
  }

  // ----------------------------------------------------------------------
  // Ablaufregeln: welche Zeile kommt als Nächstes?
  // ----------------------------------------------------------------------
  // Zustand eines Tests (alle Stufen in Zehnteln logMAR):
  //   modus     'start' = erste Zeile noch nicht gewertet, 'auf' = es geht nach oben (größer),
  //             weil die bisherigen Zeilen nicht gelesen wurden, 'ab' = es geht abwärts
  //   aktuell   die Stufe der Zeile, die jetzt gezeigt wird
  //   kleinste, groesste   kleinste und größte bisher gezeigte Stufe
  //   fertig    true, sobald der Test zu Ende ist
  //   min, max  feinste und gröbste erlaubte Stufe (Vorgabe -1 und 10; Fernsehtest -3 und je nach
  //             Bildschirm)
  function neuerVerlauf(startLogmar, minZehntel, maxZehntel) {
    var min = isFinite(minZehntel) ? Math.round(minZehntel) : ZEHNTEL_MIN;
    var max = isFinite(maxZehntel) ? Math.round(maxZehntel) : ZEHNTEL_MAX;
    if (max < min) max = min;
    var s = Math.round((isFinite(startLogmar) ? startLogmar : 0.8) * 10);
    s = Math.max(min, Math.min(max, s));
    return { modus: 'start', aktuell: s, kleinste: s, groesste: s, fertig: false, min: min, max: max };
  }

  // Meldet das Ergebnis der gerade gezeigten Zeile (richtig von anzahl) und
  // bestimmt die nächste Stufe oder das Ende.
  //   - Phase 'start'/'auf': Hat die Zeile genug richtige (4 von 5), ist sie die Ausgangszeile,
  //     und es geht unterhalb der kleinsten bisher gezeigten Zeile abwärts weiter. Sonst
  //     eine Stufe größer, höchstens bis zur gröbsten Zeile (Vorgabe 1,0); wird dort nicht
  //     gelesen, ist der Test zu Ende.
  //   - Phase 'ab': Ende bei mehr als der Hälfte falsch (bei 5 Buchstaben: 3 oder mehr Fehler)
  //     oder nach der feinsten Zeile (Vorgabe -0,1).
  function verlaufWeiter(v, richtig, anzahl) {
    var min = isFinite(v.min) ? v.min : ZEHNTEL_MIN;
    var max = isFinite(v.max) ? v.max : ZEHNTEL_MAX;
    var bestanden = richtig >= Math.ceil(BESTEHEN_ANTEIL * anzahl - 1e-9);
    var zuVieleFalsch = (anzahl - richtig) * 2 > anzahl;
    v.kleinste = Math.min(v.kleinste, v.aktuell);
    v.groesste = Math.max(v.groesste, v.aktuell);

    if (v.modus === 'ab') {
      if (zuVieleFalsch || v.aktuell <= min) { v.fertig = true; return v; }
      v.aktuell = v.kleinste - 1;
      return v;
    }

    if (bestanden) {                                   // Ausgangszeile gefunden
      v.modus = 'ab';
      if (v.kleinste <= min) { v.fertig = true; return v; }
      v.aktuell = v.kleinste - 1;                      // keine Zeile doppelt zeigen
    } else {
      v.modus = 'auf';
      if (v.groesste >= max) { v.fertig = true; return v; }
      v.aktuell = v.groesste + 1;
    }
    return v;
  }

  // Das Ergebnisobjekt, das an fertig() geht, aus den gezeigten Zeilen und der Dauer.
  // visus = 10^(-logMAR), beide auf zwei Nachkommastellen gerundet.
  function baueErgebnis(zeilen, dauerS) {
    var w = wertung(zeilen);
    return {
      logmar: w.logmar,
      visus: runde2(Math.pow(10, -w.logmar)),
      richtig: w.richtig,
      gezeigt: w.gezeigt,
      zeilen: zeilen,
      dauerS: dauerS
    };
  }

  // Zahl deutsch mit Komma und zwei Nachkommastellen, negative mit echtem Minuszeichen.
  function formatZahl(x) {
    var s = Math.abs(x).toFixed(2).replace('.', ',');
    return (x < 0 ? '−' : '') + s;
  }

  // ======================================================================
  // 3. Sloan-Buchstaben als Vektorformen
  // ======================================================================
  // Jede Funktion zeichnet einen Buchstaben in ein Quadrat von 5 x 5 Einheiten
  // (Ursprung oben links, y nach unten) in den aktuellen Pfad der Zeichenfläche und füllt
  // ihn. Die Umrechnung auf Bildpunkte macht zeichneBuchstabe() über die Transformation.
  //
  // Jeder Buchstabe wird mit EINEM Füllvorgang gezeichnet. Teilpfade, die einander
  // überdecken (Stamm + Bogen), werden dann zusammengefasst und nicht doppelt gedeckt;
  // sonst würden Kanten, wo sich zwei Teile überlappen, durch die Kantenglättung dunkler
  // erscheinen. Löcher entstehen durch entgegengesetzte Umlaufrichtung (Regel „nonzero“).
  //
  // Schräge Striche: Ein Strich der Dicke 1 senkrecht zu seiner Richtung ist waagerecht
  // gemessen breiter. diagBreite() löst die Gleichung  w = Länge / Höhe  für den Strich
  // aus der Mitte (xm|y1) zur Spitze, wobei die Spitze selbst von w abhängt.
  //   a - c*w = waagerechter Weg der Mittellinie, b = senkrechter Weg.
  function diagBreite(a, c, b) {
    var w = 1;
    for (var i = 0; i < 60; i++) w = Math.sqrt((a - c * w) * (a - c * w) + b * b) / b;
    return w;
  }

  // Vieleck aus x/y-Paaren in den Pfad legen (ohne zu füllen).
  function vieleck(ctx, p) {
    ctx.moveTo(p[0], p[1]);
    for (var i = 2; i < p.length; i += 2) ctx.lineTo(p[i], p[i + 1]);
    ctx.closePath();
  }

  var PI = Math.PI;

  // Schräge Striche von K, N, R, V, Z (Breiten einmal vorab ausgerechnet).
  var W_N = diagBreite(5, 1, 5);        // N: von oben links nach unten rechts, über die ganze Höhe
  var W_K = diagBreite(4, 0.5, 2.5);    // K: Arm von der Stammmitte zur Ecke oben rechts
  var M_K = 2.5 / (4 - W_K / 2);        // K: senkrechter Weg je waagerechtem Weg des Arms
  var W_V = diagBreite(2.5, 0.5, 5);    // V: Arm von oben außen zur Spitze unten Mitte
  var W_Z = diagBreite(5, 1, 3);        // Z: Diagonale zwischen den beiden Balken
  var W_R = diagBreite(2.6, 0.5, 2);    // R: Bein vom Bogen (x = 2,4) zur Ecke unten rechts
  var M_R = 2 / (5 - W_R / 2 - 2.4);    // R: senkrechter Weg je waagerechtem Weg des Beins

  var GLYPHEN = {
    // C: Ring (Außendurchmesser 5, Innendurchmesser 3) mit Öffnung rechts, die genau
    // eine Strichstärke hoch ist. Die Kanten der Öffnung sind waagerecht.
    C: function (ctx) {
      var m = 2.5, ra = 2.5, ri = 1.5;
      var wa = Math.asin(0.5 / ra), wi = Math.asin(0.5 / ri);
      ctx.beginPath();
      ctx.arc(m, m, ra, -wa, wa, true);                          // außen: links herum
      ctx.lineTo(m + Math.cos(wi) * ri, m + Math.sin(wi) * ri);  // Kante der Öffnung
      ctx.arc(m, m, ri, wi, -wi, false);                         // innen zurück
      ctx.closePath();
      ctx.fill();
    },

    // D: gerade linke Seite, oben und unten gerade bis zur Mitte, rechts Halbkreis.
    D: function (ctx) {
      ctx.beginPath();
      ctx.moveTo(0, 0); ctx.lineTo(2.5, 0);
      ctx.arc(2.5, 2.5, 2.5, -PI / 2, PI / 2, false);
      ctx.lineTo(0, 5); ctx.closePath();
      ctx.moveTo(1, 1); ctx.lineTo(1, 4); ctx.lineTo(2.5, 4);    // Loch (andere Richtung)
      ctx.arc(2.5, 2.5, 1.5, PI / 2, -PI / 2, true);
      ctx.closePath();
      ctx.fill();
    },

    // H: zwei Stämme und ein Quersteg genau in der Mitte.
    H: function (ctx) {
      ctx.beginPath();
      vieleck(ctx, [0, 0, 1, 0, 1, 2, 4, 2, 4, 0, 5, 0, 5, 5, 4, 5, 4, 3, 1, 3, 1, 5, 0, 5]);
      ctx.fill();
    },

    // K: Stamm links, zwei Arme, die sich am Stamm treffen und zu den rechten Ecken laufen.
    K: function (ctx) {
      var y1 = (4 - W_K) * M_K;             // wo die obere Kante des oberen Arms den Stamm trifft
      ctx.beginPath();
      vieleck(ctx, [0, 0, 1, 0, 1, y1, 5 - W_K, 0, 5, 0, 1 + W_K / 2, 2.5,
                    5, 5, 5 - W_K, 5, 1, 5 - y1, 1, 5, 0, 5]);
      ctx.fill();
    },

    // N: zwei Stämme und eine Diagonale von oben links nach unten rechts.
    N: function (ctx) {
      var w = W_N;
      var y4 = (4 - w) / (5 - w) * 5;       // obere Kante der Diagonale am rechten Stamm
      var y1 = 1 / (5 - w) * 5;             // untere Kante der Diagonale am linken Stamm
      ctx.beginPath();
      vieleck(ctx, [0, 0, w, 0, 4, y4, 4, 0, 5, 0, 5, 5, 5 - w, 5, 1, y1, 1, 5, 0, 5]);
      ctx.fill();
    },

    // O: Ring, Außendurchmesser 5, Innendurchmesser 3.
    O: function (ctx) {
      ctx.beginPath();
      ctx.arc(2.5, 2.5, 2.5, 0, 2 * PI, false);
      ctx.moveTo(4, 2.5);
      ctx.arc(2.5, 2.5, 1.5, 2 * PI, 0, true);                   // Loch (andere Richtung)
      ctx.fill();
    },

    // R: Stamm, Bogen oben (3 hoch, Innenraum 1 hoch) und ein schräges Bein nach unten rechts.
    R: function (ctx) {
      var dx = 2.5 / M_R;                   // waagerechter Weg des Beins von y = 5 bis y = 2,5
      ctx.beginPath();
      vieleck(ctx, [0, 0, 1, 0, 1, 5, 0, 5]);                    // Stamm
      ctx.moveTo(0, 0); ctx.lineTo(3.5, 0);                      // Bogen außen
      ctx.arc(3.5, 1.5, 1.5, -PI / 2, PI / 2, false);
      ctx.lineTo(0, 3); ctx.closePath();
      ctx.moveTo(1, 1); ctx.lineTo(1, 2); ctx.lineTo(3.5, 2);    // Innenraum (andere Richtung)
      ctx.arc(3.5, 1.5, 0.5, PI / 2, -PI / 2, true);
      ctx.closePath();
      vieleck(ctx, [5 - W_R - dx, 2.5, 5 - dx, 2.5, 5, 5, 5 - W_R, 5]);   // Bein
      ctx.fill();
    },

    // S: Mittellinie aus zwei Ellipsenbögen (oben links herum, unten rechts herum), Strichstärke 1.
    // Oben, Mitte und unten je ein Balken, dazwischen je 1 Einheit Luft.
    S: function (ctx) {
      var ende = PI * 36 / 180;             // Winkel, an dem die Enden aufhören (36 Grad zur Waagerechten)
      ctx.beginPath();
      ctx.ellipse(2.5, 1.5, 2, 1, 0, -ende, PI / 2, true);       // oberer Bogen, Ende rechts
      ctx.ellipse(2.5, 3.5, 2, 1, 0, -PI / 2, PI - ende, false); // unterer Bogen, Ende links
      ctx.lineWidth = 1;
      ctx.lineCap = 'butt';
      ctx.lineJoin = 'miter';
      ctx.stroke();
    },

    // V: zwei Schrägen, die unten mit einer flachen Spitze (so breit wie ein Strich) enden.
    V: function (ctx) {
      var w = W_V;
      var yv = (2.5 - w) / (2.5 - w / 2) * 5;       // Tiefe der inneren Spitze
      ctx.beginPath();
      vieleck(ctx, [0, 0, w, 0, 2.5, yv, 5 - w, 0, 5, 0, 2.5 + w / 2, 5, 2.5 - w / 2, 5]);
      ctx.fill();
    },

    // Z: Balken oben und unten, verbunden durch eine Diagonale von oben rechts nach unten links.
    Z: function (ctx) {
      var w = W_Z;
      ctx.beginPath();
      vieleck(ctx, [0, 0, 5, 0, 5, 1, w, 4, 5, 4, 5, 5, 0, 5, 0, 4, 5 - w, 1, 0, 1]);
      ctx.fill();
    }
  };

  // Zeichnet einen Sloan-Buchstaben mit der linken oberen Ecke (ox|oy) und der Höhe hoehe,
  // alles in Bildpunkten der Zeichenfläche. Die Transformation wird absolut gesetzt
  // (nicht an eine vorherige angehängt) und danach zurückgenommen.
  function zeichneBuchstabe(ctx, buchstabe, ox, oy, hoehe, farbe) {
    var f = GLYPHEN[buchstabe];
    if (!f) return;
    var u = hoehe / 5;                      // eine Einheit = eine Strichstärke
    ctx.save();
    ctx.setTransform(u, 0, 0, u, ox, oy);
    ctx.fillStyle = farbe || '#000';
    ctx.strokeStyle = farbe || '#000';
    f(ctx);
    ctx.restore();
  }

    '.bt-taste{padding:0;min-height:44px;border:0;border-radius:12px;background:var(--knopf-hg,#333);color:var(--knopf-text,#fff);',
    'font:inherit;font-size:28px;font-weight:600;cursor:pointer;touch-action:manipulation}'
  ].join('');

  // Den Stilblock genau einmal ins Dokument einfügen.
  function stilEinfuegen() {
    if (document.getElementById('bt-stil')) return;
    var s = document.createElement('style');
    s.id = 'bt-stil';
    s.textContent = STIL;
    document.head.appendChild(s);
  }

  function el(tag, klasse, text) {
    var e = document.createElement(tag);
    if (klasse) e.className = klasse;
    if (text != null) e.textContent = text;
    return e;
  }

  function knopf(text, klasse, aktion, beschriftung) {
    var b = el('button', klasse, text);
    b.type = 'button';
    if (beschriftung) b.setAttribute('aria-label', beschriftung);
    b.addEventListener('click', function (ev) { ev.preventDefault(); aktion(); });
    return b;
  }

  function leeren(knoten) {
    while (knoten.firstChild) knoten.removeChild(knoten.firstChild);
  }

  // ---------------------------------------------------------------------
  // Startbild mit Hinweistext
  // ---------------------------------------------------------------------
  function zeigeHinweis(a) {
    leeren(a.buehne);
    if (a.ferne) { zeigeHinweisFerne(a); return; }
    var abstandCm = a.abstandMm / 10;
    var cmText = (abstandCm === Math.round(abstandCm)) ? String(abstandCm)
      : String(Math.round(abstandCm * 10) / 10).replace('.', ',');
    var mitte = el('div', 'bt-mitte');
    mitte.appendChild(el('h1', 'bt-h1', 'Buchstabentest'));
    // Kurz gehalten: gelesen wird ohne Lesebrille, bei 28 Punkten Schrift soll alles ohne Schieben passen.
    mitte.appendChild(el('p', 'bt-text',
      cmText + ' cm Abstand, ohne Lesebrille, beide Augen offen. ' +
      'Buchstaben von links nach rechts unten antippen. Im Zweifel raten.'));
    mitte.appendChild(el('p', 'bt-klein',
      '„?“ heißt „weiß nicht“, ⌫ nimmt die letzte Eingabe zurück.'));
    mitte.appendChild(knopf('Los', 'bt-knopf bt-gross', function () {
      a.startZeit = Date.now();
      zeigeTest(a);
    }));
    a.buehne.appendChild(mitte);
  }

  // Fernsehtest: Den Text liest die zweite Person am Bildschirm, nicht die getestete Person.
  // Die Eingabetaste startet, damit niemand zum Knopf greifen muss.
  function zeigeHinweisFerne(a) {
    var mitte = el('div', 'bt-mitte');
    mitte.appendChild(el('h1', 'bt-h1', a.titel || 'Fernsehtest'));
    (a.hinweis || []).forEach(function (t) { mitte.appendChild(el('p', 'bt-text', t)); });
    mitte.appendChild(el('p', 'bt-klein',
      'Die Person nennt die Buchstaben von links nach rechts, du tippst sie auf der Tastatur. ' +
      'Leertaste: weiß nicht. Rücktaste: letzte Eingabe zurück. Ohne Rückmeldung, ob es richtig war.'));
    mitte.appendChild(knopf('Los (Eingabetaste)', 'bt-knopf bt-gross', function () { los(); }));
    a.buehne.appendChild(mitte);
    function los() {
      a.startZeit = Date.now();
      zeigeTest(a);
    }
    a.taste = function (ev) { if (ev.key === 'Enter') { ev.preventDefault(); los(); } };
  }

  // Fernsehtest: Die gröbste Zeile muss ganz in die Höhe des Fensters passen; abgezogen werden
  // Kopfzeile, Antwortfelder, Tastenhinweis und die Ränder des weißen Feldes. Gerechnet wird beim
  // Öffnen und noch einmal beim Start der ersten Zeile, weil das Fenster inzwischen ins Vollbild
  // gewechselt sein kann (dann passen gröbere Zeilen).
  function ferneBemessen(a) {
    var hoehe = a.container.clientHeight || global.innerHeight || 0;
    var frei = hoehe - 60 - 76 - 40 - (FELD_OBEN + MARKE_ABSTAND + MARKE_HOEHE + FELD_UNTEN);
    var max = groessteZeile(frei, a.abstandMm, a.mm, Math.round(a.start * 10));
    a.verlauf = neuerVerlauf(a.start, FERNE_ZEHNTEL_MIN, max);
    a.hMaxCss = Math.ceil(hoeheMm(max / 10, a.abstandMm) / a.mm);
    a.feldHoehe = FELD_OBEN + a.hMaxCss + MARKE_ABSTAND + MARKE_HOEHE + FELD_UNTEN;
  }

  // Tastatur im Fernsehtest: Buchstaben (groß oder klein), Leertaste oder „?“ für „weiß nicht“,
  // Rücktaste. Andere Tasten bleiben wirkungslos (auch Escape, das Safari für das Vollbild braucht).
  function tasteImTest(a, ev) {
    if (ev.metaKey || ev.ctrlKey || ev.altKey) return;   // Tastenkürzel von Safari nicht stören
    var k = ev.key;
    if (k === 'Backspace' || k === 'Delete') { ev.preventDefault(); zurueck(a); return; }
    if (k === ' ' || k === '?' || k === '-') { ev.preventDefault(); antwort(a, '?'); return; }
    if (typeof k === 'string' && k.length === 1) {
      var g = k.toUpperCase();
      if (BUCHSTABEN.indexOf(g) >= 0) { ev.preventDefault(); antwort(a, g); }
    }
  }

  // ---------------------------------------------------------------------
  // Testbild: weißes Feld mit der Zeile, Antwortfelder, Tastatur
  // ---------------------------------------------------------------------
  function zeigeTest(a) {
    leeren(a.buehne);
    if (a.ferne && !a.zeilen.length) ferneBemessen(a);
    var test = el('div', 'bt-test');

    a.feld = el('div', 'bt-feld');
    a.feld.style.height = a.feldHoehe + 'px';
    a.leinwand = el('canvas', 'bt-leinwand');
    a.leinwand.setAttribute('aria-label', 'Buchstabenzeile');
    a.feld.appendChild(a.leinwand);
    test.appendChild(a.feld);

    a.plaetze = el('div', 'bt-antworten');
    test.appendChild(a.plaetze);

    if (a.ferne) {
      // Fernsehtest: Eingabe über die Tastatur des Rechners, keine Tasten auf dem Bildschirm.
      test.appendChild(el('div', 'bt-tastenhinweis',
        'Buchstaben tippen · Leertaste: weiß nicht · Rücktaste: zurück'));
      a.taste = function (ev) { tasteImTest(a, ev); };
    } else {
      // Tastatur: die 10 Buchstaben, dann „?“ (weiß ich nicht) und die Rücktaste.
      var tasten = el('div', 'bt-tasten');
      BUCHSTABEN.split('').forEach(function (c) {
        tasten.appendChild(knopf(c, 'bt-taste', function () { antwort(a, c); }));
      });
      tasten.appendChild(knopf('?', 'bt-taste', function () { antwort(a, '?'); }, 'weiß ich nicht'));
      tasten.appendChild(knopf('⌫', 'bt-taste', function () { zurueck(a); }, 'letzte Eingabe zurücknehmen'));
      test.appendChild(tasten);
    }

    a.buehne.appendChild(test);
    var akzent = '';
    try { akzent = (getComputedStyle(a.wurzel).getPropertyValue('--akzent') || '').trim(); } catch (e) { /* egal */ }
    a.markeFarbe = akzent || MARKE_FARBE;
    neueZeile(a);
  }

  // Die nächste Zeile bestimmen und anzeigen.
  function neueZeile(a) {
    var logmar = a.verlauf.aktuell / 10;                 // ganze Zehntel / 10 ergibt genau 0,1er-Werte
    var hCss = hoeheMm(logmar, a.abstandMm) / a.mm;      // Buchstabenhöhe in CSS-Pixeln
    var breite = Math.floor(a.feld.clientWidth) - 2 * SEITENRAND;
    var n = passendeAnzahl(hCss, breite, a.mindestens);
    a.zeile = { logmar: logmar, buchstaben: zufallszeile(a.zufall, n), antworten: '' };

    leeren(a.plaetze);
    for (var i = 0; i < n; i++) a.plaetze.appendChild(el('div', 'bt-platz'));
    aktualisiere(a);
  }

  // Antwortfelder und Zeichnung nach jeder Eingabe auffrischen.
  function aktualisiere(a) {
    var z = a.zeile, kinder = a.plaetze.children;
    for (var i = 0; i < kinder.length; i++) {
      kinder[i].textContent = i < z.antworten.length ? z.antworten.charAt(i) : '';
      kinder[i].className = 'bt-platz' + (i === z.antworten.length ? ' bt-platz-dran' : '');
    }
    zeichneZeile(a);
  }

  // Zeile auf die Zeichenfläche malen. Die Zeichenfläche hat echte Geräteauflösung:
  // Größe in Bildpunkten = CSS-Größe * devicePixelRatio. Die Buchstabenhöhe wird nicht
  // gerundet (sonst würde die Stufe verfälscht), aber die linke obere Ecke jedes Buchstabens
  // liegt auf einem ganzen Bildpunkt, damit alle Buchstaben gleich abgetastet werden.
  function zeichneZeile(a) {
    var c = a.leinwand, z = a.zeile;
    var cssB = Math.floor(a.feld.clientWidth);
    if (!(cssB > 0)) return;
    var dpr = global.devicePixelRatio || 1;
    c.width = Math.round(cssB * dpr);
    c.height = Math.round(a.feldHoehe * dpr);
    c.style.width = cssB + 'px';
    c.style.height = a.feldHoehe + 'px';
    var s = c.width / cssB;                              // wirklicher Maßstab Bildpunkte je CSS-Pixel
    var ctx = c.getContext('2d');
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, c.width, c.height);

    var n = z.buchstaben.length;
    var h = hoeheMm(z.logmar, a.abstandMm) / a.mm * s;   // Buchstabenhöhe in Bildpunkten
    var x0 = (c.width - (2 * n - 1) * h) / 2;            // Zeile mittig
    var unten = Math.round((FELD_OBEN + a.hMaxCss) * s); // gemeinsame Grundlinie aller Zeilen
    var oben = Math.round(unten - h);
    var i, x;
    for (i = 0; i < n; i++) {
      x = Math.round(x0 + i * 2 * h);
      zeichneBuchstabe(ctx, z.buchstaben.charAt(i), x, oben, h, '#000');
    }

    // Markierung: kleines Dreieck unter dem Buchstaben, der als Nächstes beantwortet wird.
    i = z.antworten.length;
    if (i < n) {
      var mx = Math.round(x0 + i * 2 * h) + h / 2;
      var sp = unten + MARKE_ABSTAND * s;                // Spitze
      ctx.fillStyle = a.markeFarbe;
      ctx.beginPath();
      ctx.moveTo(mx, sp);
      ctx.lineTo(mx - MARKE_BREITE / 2 * s, sp + MARKE_HOEHE * s);
      ctx.lineTo(mx + MARKE_BREITE / 2 * s, sp + MARKE_HOEHE * s);
      ctx.closePath();
      ctx.fill();
    }
  }

  // Eine Taste wurde angetippt.
  function antwort(a, zeichen) {
    if (a.beendet) return;
    var z = a.zeile;
    if (z.antworten.length >= z.buchstaben.length) return;
    z.antworten += zeichen;
    if (z.antworten.length >= z.buchstaben.length) zeileFertig(a); else aktualisiere(a);
  }

  // Rücktaste: nimmt die letzte Antwort der laufenden Zeile zurück.
  function zurueck(a) {
    if (a.beendet) return;
    var z = a.zeile;
    if (z.antworten.length > 0) z.antworten = z.antworten.slice(0, -1);
    aktualisiere(a);
  }

  // Alle Antworten einer Zeile sind da: zählen, sofort weiter (ohne Rückmeldung, damit man
  // nicht lernt, welche Antworten stimmten).
  function zeileFertig(a) {
    var z = a.zeile, richtig = 0;
    for (var i = 0; i < z.buchstaben.length; i++) {
      if (z.antworten.charAt(i) === z.buchstaben.charAt(i)) richtig++;
    }
    a.zeilen.push({ logmar: z.logmar, buchstaben: z.buchstaben, antworten: z.antworten, richtig: richtig });
    verlaufWeiter(a.verlauf, richtig, z.buchstaben.length);

  }

  // ---------------------------------------------------------------------
  // Schlussbild
  // ---------------------------------------------------------------------
  function zeigeErgebnis(a) {
    a.ergebnis = baueErgebnis(a.zeilen, Math.round((Date.now() - a.startZeit) / 1000));
    leeren(a.buehne);
    var mitte = el('div', 'bt-mitte');
    mitte.appendChild(el('div', 'bt-ergebnis',
      'Ergebnis: Visus ' + formatZahl(a.ergebnis.visus) + ' (logMAR ' + formatZahl(a.ergebnis.logmar) + ')'));
    mitte.appendChild(el('p', 'bt-klein',
      a.ergebnis.richtig + ' von ' + a.ergebnis.gezeigt + ' Buchstaben richtig gelesen.'));
    mitte.appendChild(knopf(a.ferne ? 'Weiter (Eingabetaste)' : 'Weiter', 'bt-knopf bt-gross',
      function () { beenden(a, a.ergebnis); }));
    a.buehne.appendChild(mitte);
    a.taste = a.ferne ? function (ev) {
      if (ev.key === 'Enter') { ev.preventDefault(); beenden(a, a.ergebnis); }
    } : null;
  }

  // ---------------------------------------------------------------------
  // Aufräumen und Beenden
  // ---------------------------------------------------------------------
  function beenden(a, ergebnis) {
    if (a.beendet) return;
    a.beendet = true;
    global.removeEventListener('resize', a.beiGroessenaenderung);
    global.removeEventListener('orientationchange', a.beiGroessenaenderung);
    if (a.beiTaste) global.document.removeEventListener('keydown', a.beiTaste);
    if (a.wurzel.parentNode) a.wurzel.parentNode.removeChild(a.wurzel);
    if (aktiv === a) aktiv = null;
    if (typeof a.fertig === 'function') a.fertig(ergebnis);
  }

  // ======================================================================
  // 5. Öffentliche Schnittstelle
  // ======================================================================

  function starten(container, opts, fertig) {
    if (aktiv) abbrechen();                                // höchstens ein Test zugleich
    opts = opts || {};
    var mm = Number(opts.mmProPunkt);
    if (!(mm > 0) || !isFinite(mm)) {
      // Ohne Größenabgleich wäre die Buchstabengröße geraten und die Messung wertlos.
      throw new TypeError('Buchstabentest: opts.mmProPunkt fehlt oder ist ungültig');
    }
    var abstand = Number(opts.abstandMm);
    if (!(abstand > 0) || !isFinite(abstand)) abstand = 400;

    stilEinfuegen();

    var ferne = opts.ferne === true;
    var start = opts.startLogmar == null ? (ferne ? FERNE_START : 0.8) : Number(opts.startLogmar);
    var a = {
      container: container,
      fertig: fertig,
      mm: mm,
      abstandMm: abstand,
      ferne: ferne,
      titel: opts.titel ? String(opts.titel) : '',
      hinweis: Array.isArray(opts.hinweis) ? opts.hinweis.map(String) : [],
      mindestens: ferne ? FERNE_MINDESTENS : 3,
      zeilen: [],
      zufall: (typeof opts.zufall === 'function') ? opts.zufall : Math.random,
      beendet: false,
      startZeit: Date.now(),
      taste: null
    };

    a.start = start;
    if (ferne) {
      ferneBemessen(a);
    } else {
      a.verlauf = neuerVerlauf(start);
      // Das weiße Feld ist für die größte mögliche Zeile (1,0 logMAR) bemessen und bleibt für
      // alle Zeilen gleich hoch; die Grundlinie der Buchstaben liegt immer an derselben Stelle.
      a.hMaxCss = Math.min(400, Math.ceil(hoeheMm(ZEHNTEL_MAX / 10, abstand) / mm));
      a.feldHoehe = FELD_OBEN + a.hMaxCss + MARKE_ABSTAND + MARKE_HOEHE + FELD_UNTEN;
    }

    // Grundgerüst: Kopfzeile mit dem Abbrechen-Knopf und eine Bühne für die wechselnden Bilder.
    a.wurzel = el('div', 'bt-wurzel');
    var kopf = el('div', 'bt-kopf');
    kopf.appendChild(el('div', 'bt-titel', ferne ? (a.titel || 'Fernsehtest') : 'Buchstabentest'));
    kopf.appendChild(knopf('Abbrechen', 'bt-knopf bt-abbrechen', function () { abbrechen(); }));
    a.wurzel.appendChild(kopf);
    a.buehne = el('div', 'bt-buehne');
    a.wurzel.appendChild(a.buehne);

    // Während des Tests soll sich nichts verschieben und nichts zoomen: Zoom würde
    // die Buchstabengröße verfälschen.
    var sperre = function (ev) { ev.preventDefault(); };
    a.wurzel.addEventListener('touchmove', sperre, { passive: false });
    a.wurzel.addEventListener('gesturestart', sperre);

    a.beiGroessenaenderung = function () {
      if (a.beendet || !a.zeile || !a.leinwand || !a.leinwand.parentNode) return;
      zeichneZeile(a);
    };
    global.addEventListener('resize', a.beiGroessenaenderung);
    global.addEventListener('orientationchange', a.beiGroessenaenderung);

    // Tastatur (nur Fernsehtest): Jede Ansicht setzt a.taste auf ihre eigene Behandlung.
    if (ferne) {
      a.beiTaste = function (ev) { if (!a.beendet && typeof a.taste === 'function') a.taste(ev); };
      global.document.addEventListener('keydown', a.beiTaste);
    }

    container.appendChild(a.wurzel);
    aktiv = a;
    zeigeHinweis(a);
  }

  // Beendet den laufenden Test ohne Ergebnis; fertig(null) wird aufgerufen.
  function abbrechen() {
    if (aktiv) beenden(aktiv, null);
  }

  global.Buchstabentest = {
    starten: starten,
    abbrechen: abbrechen,
    hoeheMm: hoeheMm,
    wertung: wertung,
    zufallszeile: zufallszeile,
    // Nur für Tests und die Probeseite, nicht Teil der Schnittstelle:
    _intern: {
      glyphen: GLYPHEN,
      zeichneBuchstabe: zeichneBuchstabe,
      neuerVerlauf: neuerVerlauf,
      verlaufWeiter: verlaufWeiter,
      passendeAnzahl: passendeAnzahl,
      groessteZeile: groessteZeile,
      tasteImTest: tasteImTest,
      formatZahl: formatZahl,
      baueErgebnis: baueErgebnis,
      breiten: { N: W_N, K: W_K, V: W_V, Z: W_Z, R: W_R }
    }
  };
})(typeof window !== 'undefined' ? window : this);

</script>
<script>
// ===== speicher_gemeinsam.js =====
// Gemeinsame Regeln der beiden Speicher (claude.ai-Seite: speicher_claude.js, Web-App:
// speicher_github.js): wie leere Daten aussehen, welche von zwei Fassungen neuer ist und wie der
// Dateiname einer Person bei GitHub lautet.
// Daten: { zustand, sitzungen: [...], buchstabentests: [...], stand }
// "stand" zählt die Speichervorgänge; beim Vergleich gilt die Fassung mit dem höheren Stand.
(function (global) {
  'use strict';

  function leer() { return { zustand: null, sitzungen: [], buchstabentests: [], stand: 0 }; }

  // Rangfolge zweier Fassungen: zuerst der Stand, bei Gleichstand (ältere Daten ohne
  // Stand) die Zahl der Sitzungen, dann der Buchstabentests, dann ob eine Einrichtung da ist.
  function rang(d) {
    var z = d && d.zustand;
    return [d && d.stand || 0, z ? z.sitzungen : -1, d && d.buchstabentests ? d.buchstabentests.length : 0, z && z.kalibrierung ? 1 : 0];
  }
  // Ist Fassung a neuer als Fassung b? Bei völligem Gleichstand: nein.
  function neuer(a, b) {
    var ra = rang(a), rb = rang(b);
    for (var i = 0; i < ra.length; i++) { if (ra[i] !== rb[i]) return ra[i] > rb[i]; }
    return false;
  }

  // Dateiname aus dem Namen der Person: klein, Umlaute ausgeschrieben, nur a–z, 0–9 und „-“.
  // Aus „Wiebke“ wird „wiebke“, aus „Jürgen Groß“ „juergen-gross“. Leerer Name: null.
  function kennungAus(name) {
    var k = String(name || '').toLowerCase().replace(/ä/g, 'ae').replace(/ö/g, 'oe').replace(/ü/g, 'ue').replace(/ß/g, 'ss');
    if (k.normalize) k = k.normalize('NFD').replace(/[̀-ͯ]/g, '');
    k = k.replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 40);
    return k || null;
  }

  global.SpeicherRegeln = { leer: leer, rang: rang, neuer: neuer, kennungAus: kennungAus };
})(typeof window !== 'undefined' ? window : this);

</script>
<script>
// ===== geraete.js =====
// Geräte und Verbindungscode (Web-App und Fernsehtest am MacBook).
//
// 1. Größe aus dem Modell: Beim iPhone 12 Pro (und den Modellen mit genau demselben Bildschirm)
//    ist bekannt, wie breit der Bildschirm ist: 1170 Bildpunkte bei 460 Bildpunkten je Zoll =
//    64,60 mm. Die Seite ist bei Anzeigezoom „Standard“ 390 Punkte breit, bei „Vergrößert“ 320
//    Punkte (das iPhone vergrößert dann das ganze Bild um 390/320 = 1,22). Daraus folgt, wie viele
//    Millimeter ein Punkt sind, ohne Karte: 0,1657 bzw. 0,2019 mm. Gerechnet wird bei jedem Start
//    neu, falls der Zoom umgestellt wurde. Passen die Maße zu keiner bekannten Fassung, gibt es
//    keinen Wert, und es gilt wie bisher der Größenabgleich mit der Karte.
//    Quellen: Apple, technische Daten (2532 × 1170 Bildpunkte, 460 ppi); Punkte und Zoom nach
//    https://gist.github.com/ricsantos/e7baee6885626b9cb87c021a5097623f (390 × 844, gezoomt 320 × 693, @3x).
//
// 2. Verbindungscode: ein Text, in dem Name der Person, Zugangsschlüssel und Modell des iPhones
//    stecken. Das MacBook erzeugt ihn, die Web-App liest ihn beim Einrichten. Er ist nur umgeformt
//    (Base64), nicht verschlüsselt: Wer ihn hat, hat den Schlüssel. Aufbau: „ST1-“ und danach die
//    Angaben als JSON in Base64 ohne +, / und = (damit er als ein Wort markiert werden kann).
//    Die Web-App findet den Code auch in einer ganzen eingefügten Nachricht.
(function (global) {
  'use strict';

  var MM_PRO_ZOLL = 25.4;

  // Bekannte Modelle. breiteMm: Breite des Bildschirms im Hochformat. fassungen: Maße der Seite in
  // Punkten und Bildpunkte je Punkt (devicePixelRatio) je Anzeigezoom.
  var MODELLE = {
    'iphone-12-pro': {
      name: 'iPhone 12 Pro',
      auch: 'gleicher Bildschirm: iPhone 12, 13, 13 Pro, 14',
      breiteMm: 1170 / 460 * MM_PRO_ZOLL,
      fassungen: [
        { breite: 390, hoehe: 844, dpr: 3, zoom: 'standard' },
        { breite: 320, hoehe: 693, dpr: 3, zoom: 'vergroessert' }
      ]
    }
  };
  var ANDERES = 'anderes';     // anderes Gerät: Größe mit der Karte
  var ZOOM_TEXT = { standard: 'Anzeigezoom „Standard“', vergroessert: 'Anzeigezoom „Vergrößert“' };

  function modellName(m) { return MODELLE[m] ? MODELLE[m].name : 'anderes iPhone'; }

  // Millimeter je Punkt aus Modell und Bildschirm: { mmProPunkt, zoom } oder null.

// ===== github_zugriff.js =====
// Zugriff auf Dateien im privaten Repository bei GitHub (Contents-Schnittstelle), mit Frist.
// Gemeinsam für die Sicherung der Web-App (speicher_github.js) und den Fernsehtest am MacBook
// (ferne.js). Alle Dateien liegen im Ordner daten/ des Repositorys.
//
// Ziel (Besitzer und Name des privaten Repositorys) setzt das Bauwerkzeug als
// window.SEHTRAINING_ZIEL = { api, besitzer, repo, zweig }. Der Zugangsschlüssel kommt bei jeder
// Anfrage vom Aufrufer; dieser Teil speichert nichts.
(function (global) {
  'use strict';
  var ZIEL = global.SEHTRAINING_ZIEL || { api: 'https://api.github.com', besitzer: '', repo: '', zweig: 'main' };
  var fristMs = 20000;        // so lange wird höchstens auf eine Antwort von GitHub gewartet

  function zweig() { return ZIEL.zweig || 'main'; }
  function repoName() { return ZIEL.besitzer + '/' + ZIEL.repo; }
  function repoWeg() { return '/repos/' + encodeURIComponent(ZIEL.besitzer) + '/' + encodeURIComponent(ZIEL.repo); }

  function zuBase64(text) { return global.btoa(unescape(encodeURIComponent(text))); }

  // Fehler: { art: 'status', status }, { art: 'kaputt' } (kein gültiges JSON), frist, netz.

      var r = await anfrage('GET', weg, null, schl, true);

  // mit 409 oder 422 ab), ohne sha: legt die Datei neu an. Ergebnis: { status, sha }.

  // zeigt; sonst Fehler { art: 'status', status, beim: 'repo' } bzw. frist oder netz.

  };

// ===== ferne.js =====
/*
 * ferne.js – Fernsehtest am MacBook
 * ==================================
 * Derselbe Buchstabentest wie in der Nähe, aber in der Ferne und ohne Brille: Das MacBook zeigt die
 * Buchstaben, die getestete Person steht oder sitzt an einer markierten Stelle in etwa 6 m Abstand

 * rechte Auge, das linke Auge und beide Augen.
 *

 * eingeben, den Zugangsschlüssel „Sehtraining“ einfügen („Geräte verbinden“). Die Buchstaben werden auf
 * den eingegebenen Abstand gerechnet.
 *
 * Geräte verbinden (seit 2026-11-01): Ein Schlüssel für alle Geräte. Ist er am MacBook eingefügt, schickt
 * die Seite je Person eine Nachricht an deren iPhone (Teilen-Fenster von Safari, sonst Zwischenablage):
 * zwei Sätze Anleitung, der Link zur Web-App und der Verbindungscode (Name, Schlüssel und Modell des
 * iPhones in einem Text, siehe geraete.js). Am iPhone wird die ganze Nachricht in die Web-App eingesetzt.
 *

 * MacBooks, dann im Hintergrund in einer eigenen Datei je Person im privaten Repository
 * (daten/<kennung>-ferne.json, Dateiname nach derselben Regel wie die Datei des iPhones). Das iPhone
 * liest daraus nur den letzten Wert; so schreiben iPhone und MacBook nie in dieselbe Datei.
 * Größe und Abstand liegen zusätzlich in daten/geraet-macbook.json: Löscht Safari den Speicher des
 * MacBooks (7-Tage-Regel), genügt ein neuer Schlüssel, Größe und Abstand kommen von GitHub zurück.
 *
 * Benutzt: Kalibrierung.groesse, Buchstabentest (Fassung „ferne“), GitHubZugriff, SpeicherRegeln, Geraete.
 * Reine Funktionen (mit jsc testbar) unter window.Ferne._intern.

(function (global) {
  'use strict';

  // 1. Festwerte
  // ======================================================================

  var LS_SCHLUESSEL = 'sehtraining-ferne-schluessel'; // Zugangsschlüssel (nur auf diesem MacBook)
  var LS_OFFEN = 'sehtraining-ferne-offen';           // Tests, die noch nicht bei GitHub angekommen sind
  var LS_VERLAUF = 'sehtraining-ferne-verlauf';       // Ergebnisse je Person, Kopie auf diesem MacBook
  var GERAET_DATEI = 'geraet-macbook.json';

      text: function (n) { return n + ' deckt das linke Auge mit der flachen Hand ab, ohne zu drücken, und liest mit dem rechten.'; } },
    { feld: 'links', titel: 'Linkes Auge',
      text: function (n) { return 'Jetzt deckt ' + n + ' das rechte Auge ab und liest mit dem linken.'; } },
    { feld: 'beide', titel: 'Beide Augen',
      text: function (n) { return 'Jetzt liest ' + n + ' mit beiden Augen offen.'; } }

    frist: 'GitHub hat nicht innerhalb von 20 Sekunden geantwortet',
    schluessel: 'GitHub nimmt den Zugangsschlüssel nicht an (unvollständig kopiert oder gelöscht)',
    zugriff: 'der Zugangsschlüssel hat keinen Zugriff auf das Repository',

  // 2. Reine Funktionen (ohne DOM)

  }

  function dateiText(person, tests) {
    return JSON.stringify({ person: person, gespeichertAm: new Date().toISOString(), tests: tests }, null, 1) + '\n';
  }

  // umgebung: { dpr, bildschirm } (devicePixelRatio und „Breite×Höhe“ des Bildschirms in Punkten).
  function groesseGilt(geraet, umgebung) {

  }

    ].concat(namen.map(personKarte)).concat([
      el('section', { class: 'karte' }, [
        el('label', { class: 'feld-titel', text: 'Weitere Person (Vorname, genau wie später am iPhone)' }), neuFeld,
        el('div', { class: 'reihe' }, [knopf('Hinzufügen', false, hinzufuegen), knopf('Zurück zur Startseite', false, function () { zeigeStart(); })])
      ]),
      el('p', { class: 'leise', text: 'Anderen Schlüssel verwenden: ' }, [knopf('Schlüssel ersetzen', false, function () { zeigeSicherung(); })])
    ]));
  }

  // --- Ablauf eines Tests ---
  function zeigeVorbereitung() {
    personMerken(person);
    var los = knopf('Los: Vollbild und rechtes Auge (Eingabetaste)', true, starten);
    function taste(ev) { if (ev.key === 'Enter') { ev.preventDefault(); starten(); } }
    // Nicht auf das Vollbild warten: Manche Fenster antworten darauf nie. Die gröbste Zeile rechnet
    // der Buchstabentest ohnehin erst beim Start der ersten Zeile, wenn das Vollbild steht.
    function starten() {
      d.removeEventListener('keydown', taste);
      vollbild(true);
      messen(0, {});
    }
    d.addEventListener('keydown', taste);
    ansicht([
      el('header', { class: 'kopf' }, [el('h1', { text: 'Fernsehtest: ' + person })]),
      el('section', { class: 'karte' }, [
        el('ol', { class: 'schritte' }, [
          el('li', { text: 'Bildschirm ganz hell (Taste mit der großen Sonne), Raum normal hell, kein Licht von hinten auf den Bildschirm.' }),
          el('li', { text: person + ' ohne Brille an die Markierung, ' + abstandText(geraet.abstandMm) + ' vor dem Bildschirm.' }),
          el('li', { text: 'Du sitzt neben dem MacBook, tippst die Buchstaben, die ' + person + ' nennt, und sagst nicht, ob sie richtig waren.' }),
          el('li', { text: 'Gemessen werden nacheinander das rechte Auge, das linke Auge und beide Augen, zusammen etwa 5 bis 10 Minuten.' })
        ]),
        el('div', { class: 'reihe' }, [los, knopf('Zurück', false, function () { d.removeEventListener('keydown', taste); zeigeStart(); })])
      ])
    ]);
  }

  function messen(nr, ergebnisse) {
    if (nr >= AUGEN.length) { testFertig(ergebnisse); return; }
    var auge = AUGEN[nr], c = modulOeffnen();
    global.Buchstabentest.starten(c, {
      mmProPunkt: geraet.mmProPunkt, abstandMm: geraet.abstandMm, ferne: true,
      titel: auge.titel + ' (' + person + ')',
      hinweis: [auge.text(person), 'Abstand ' + abstandText(geraet.abstandMm) + ', ohne Brille.']
    }, function (e) {
      if (!e) { vollbild(false); zeigeStart('Test abgebrochen, nichts gespeichert.'); return; }
      ergebnisse[auge.feld] = e;
      messen(nr + 1, ergebnisse);
    });
  }

  function testFertig(ergebnisse) {
    var jetzt = new Date(), kennung = global.SpeicherRegeln.kennungAus(person);
    var test = {
      id: jetzt.toISOString() + '-' + Math.random().toString(36).slice(2, 6),
      datum: datumHeute(jetzt), zeit: jetzt.toISOString(), geraet: 'MacBook', ohneBrille: true,
      abstandMm: geraet.abstandMm, mmProPunkt: geraet.mmProPunkt,
      rechts: messung(ergebnisse.rechts), links: messung(ergebnisse.links), beide: messung(ergebnisse.beide)
    };
    var offen = lesen(LS_OFFEN) || [];
    offen.push({ kennung: kennung, person: person, test: test });
    var gespeichert = schreiben(LS_OFFEN, offen);
    verlaufMerken(kennung, zusammenfuehren(verlauf(kennung), test));
    hochladen();

    var tabelle = el('table', { class: 'tabelle' });
    tabelle.appendChild(el('tr', null, ['', 'Visus', 'logMAR', 'richtig'].map(function (t) { return el('th', { text: t }); })));
    AUGEN.forEach(function (a) {
      var m = test[a.feld];
      tabelle.appendChild(el('tr', null, [el('td', { text: a.titel }), el('td', { text: zahlDe(m.visus, 2) }),
        el('td', { text: zahlDe(m.logmar, 2) }), el('td', { text: m.richtig + ' von ' + m.gezeigt })]));
    });
    var status = el('p', { text: '' });
    function statusZeigen() { status.textContent = 'Sicherung: ' + sicherungStatus() + '.'; }
    beiAenderung = statusZeigen;
    statusZeigen();
    ansicht([
      el('header', { class: 'kopf' }, [el('h1', { text: 'Ergebnis: ' + person })]),
      el('section', { class: 'karte' }, [
        tabelle,
        el('p', { text: gespeichert ? 'Gespeichert auf diesem MacBook.' : 'Speichern auf diesem MacBook ist fehlgeschlagen.' }),
        status,
        knopf('Fertig', true, function () { beiAenderung = null; vollbild(false); zeigeStart(); })
      ])
    ]);
  }

  // ======================================================================
  // 6. Start
  // ======================================================================
  function start() {
    wurzel = d.getElementById('ferne');
    modul = d.getElementById('ferne-modul');
    person = (geraet.personen || [])[0] || '';
    beiAenderung = null;
    zeigeStart();
    hochladen();
    // Internet wieder da oder Fenster wieder im Vordergrund: Offenes nachholen.
    global.addEventListener('online', function () { hochladen(); });
    d.addEventListener('visibilitychange', function () { if (d.visibilityState === 'visible') hochladen(); });
  }

  global.Ferne = {
    start: start,
    // nur für Tests
    _intern: {
      abstandAusText: abstandAusText, abstandText: abstandText, zusammenfuehren: zusammenfuehren, dateiText: dateiText,
      groesseGilt: groesseGilt, messung: messung, schluesselLink: schluesselLink, fehlerArt: fehlerArt, voruebergehend: voruebergehend, zahlDe: zahlDe,
      datumHeute: datumHeute, einenHochladen: einenHochladen, einrichtenPruefen: einrichtenPruefen, hochladen: hochladen,
      sicherungStatus: sicherungStatus, verlauf: verlauf,
      neuLesen: function () { geraet = lesen(LS_GERAET) || {}; letzterFehler = null; }
    }
  };
  if (d && d.readyState !== 'loading' && d.getElementById && d.getElementById('ferne')) start();
  else if (d) d.addEventListener('DOMContentLoaded', function () { if (d.getElementById('ferne')) start(); });
})(typeof window !== 'undefined' ? window : this);

</script>
